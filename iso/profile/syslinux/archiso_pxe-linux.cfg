LABEL arch_nbd
TEXT HELP
Boot the Firelamp OS using NBD.
It allows you to try Firelamp OS or install it.
ENDTEXT
MENU LABEL Firelamp OS (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

