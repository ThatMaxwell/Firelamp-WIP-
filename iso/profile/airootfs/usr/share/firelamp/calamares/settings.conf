# Firelamp OS installer (Calamares). Offline install: copies the live system
# from the ISO's squashfs, then turns it into a normal installed system.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       cleanup
  module:   shellprocess
  config:   shellprocess_cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - initcpiocfg
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@cleanup
  - services-systemd
  - initcpio
  - bootloader
  - umount
- show:
  - finished

branding: firelamp
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
