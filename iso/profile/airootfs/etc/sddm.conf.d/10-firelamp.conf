# Firelamp OS live: log straight into KDE Plasma (Wayland) as the live user.
[Autologin]
User=firelamp
Session=plasma
Relogin=false

# Run the login screen itself on Wayland (KWin), so no X server is needed.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=breeze
CursorTheme=breeze_cursors
