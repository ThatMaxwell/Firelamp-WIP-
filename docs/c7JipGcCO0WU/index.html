<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Firelamp media</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Martian+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#121110;--fg:#ece6df;--mute:#8f8780;--line:#26221f;--card:#1b1917;--ember:#f26a2e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Instrument Sans",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:56px 16px}
h1{font-size:28px;margin:0 0 6px;font-weight:600}p{color:var(--mute);margin:0 0 24px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
a.btn,button{font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none}
button.primary{background:var(--ember);border-color:var(--ember);color:#160c06}
#st{font:13px "Martian Mono",monospace;color:var(--mute)}
h2{font:500 12px "Martian Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:28px 0 8px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
li a{color:var(--fg);min-width:0;overflow-wrap:anywhere}li a:hover{color:var(--ember)}
li span{font:12px "Martian Mono",monospace;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
li.done a{color:var(--mute)}
</style></head><body><main>
<h1>Firelamp media</h1>
<p>Every screenshot and video downloads one by one as soon as this page opens. If your browser asks to allow multiple downloads, allow it.</p>
<div class="bar"><button class="primary" id="go">Download all again</button><a class="btn" href="firelamp-media.zip" download>Get one zip instead</a><span id="st"></span></div>
<div id="list"></div>
</main><script>
const FILES=[["brand/boil/fire-cursor-boil.mp4", 38992], ["brand/boil/frame1.png", 29369], ["brand/boil/frame2.png", 29559], ["brand/boil/frame3.png", 29567], ["design/board/target-desktop.png", 222926], ["design/board/target-edit-home.png", 304779], ["firelamp-ui/drag.png", 271760], ["firelamp-ui/qt/desktop.png", 308253], ["firelamp-ui/timeline.png", 328391], ["firelamp-ui/vision.png", 342374], ["iso-build/placeholder-desktop.png", 183304], ["os-ui/activity.png", 747933], ["os-ui/app-about.png", 870699], ["os-ui/app-calendar.png", 816990], ["os-ui/app-music.png", 984230], ["os-ui/app-photos.png", 1203380], ["os-ui/app-settings.png", 874976], ["os-ui/app-terminal.png", 873541], ["os-ui/app-web.png", 739330], ["os-ui/askbar-empty.png", 999353], ["os-ui/askbar.png", 969018], ["os-ui/autopause.mp4", 569418], ["os-ui/autopause.png", 748496], ["os-ui/control-center.png", 852772], ["os-ui/desktop.png", 786472], ["os-ui/desktops-installed.png", 831180], ["os-ui/desktops-installing.png", 828417], ["os-ui/desktops.mp4", 268164], ["os-ui/desktops.png", 850209], ["os-ui/dock.mp4", 577129], ["os-ui/drag.png", 751121], ["os-ui/edit-home-dock.png", 1617108], ["os-ui/edit-home-wallpaper.png", 1724133], ["os-ui/edit-home-widgets.png", 1247253], ["os-ui/edit-home.mp4", 1598243], ["os-ui/edit-home.png", 1173213], ["os-ui/email-plan.png", 911907], ["os-ui/email.mp4", 1161164], ["os-ui/firstboot-after.png", 903299], ["os-ui/firstboot-continue.png", 859436], ["os-ui/firstboot-empty.png", 850774], ["os-ui/firstboot-signed.png", 841090], ["os-ui/firstboot-signing.png", 843569], ["os-ui/firstboot-typed.png", 856884], ["os-ui/firstboot.mp4", 1124137], ["os-ui/home-after.png", 1686773], ["os-ui/home-menu.png", 1270056], ["os-ui/live-dock.png", 1029350], ["os-ui/live-menu.png", 1041778], ["os-ui/live-toast.png", 1053825], ["os-ui/login-failed.png", 844548], ["os-ui/login-sessions.png", 847048], ["os-ui/login.png", 840880], ["os-ui/looks-accent.png", 1169069], ["os-ui/looks-graphite.png", 1174 const fmt=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.round(b/1024)+" KB";
const name=p=>p.replaceAll("/","-");
const list=document.getElementById("list"),st=document.getElementById("st"),rows={};
let cur=null;
for(const[p,s]of FILES){const g=p.includes("/")?p.slice(0,p.lastIndexOf("/")):"other";
 if(g!==cur){cur=g;const h=document.createElement("h2");h.textContent=g;list.append(h,document.createElement("ul"))}
 const li=document.createElement("li"),a=document.createElement("a");a.href=p;a.download=name(p);a.textContent=p.split("/").pop();
 const sp=document.createElement("span");sp.textContent=fmt(s);li.append(a,sp);list.lastChild.append(li);rows[p]=li}
let busy=false;
async function all(){if(busy)return;busy=true;
 for(let i=0;i<FILES.length;i++){const p=FILES[i][0];st.textContent=`${i+1} / ${FILES.length}`;
  const a=document.createElement("a");a.href=p;a.download=name(p);document.body.append(a);a.click();a.remove();
  rows[p].classList.add("done");await new Promise(r=>setTimeout(r,800))}
 st.textContent=`${FILES.length} files sent to your downloads`;busy=false}
document.getElementById("go").onclick=all;all();
</script></body></html>
