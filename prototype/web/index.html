<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firelamp OS</title>
  <link rel="icon" href="../../brand/firelamp-cursor.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/chrome.css">
  <link rel="stylesheet" href="css/windows.css">
  <link rel="stylesheet" href="css/agent.css">
  <link rel="stylesheet" href="css/apps.css">
</head>
<body>
  <canvas id="wallpaper" aria-hidden="true"></canvas>
  <div id="grain" aria-hidden="true"></div>

  <header id="menubar" role="menubar" aria-label="Menu bar"></header>
  <main id="desktop" aria-label="Desktop"></main>
  <nav id="dock-wrap" aria-label="Dock"><div id="dock" role="toolbar" aria-label="Dock"></div></nav>

  <div id="overlay-layer" aria-hidden="true">
    <canvas id="embers"></canvas>
    <div id="vision"></div>
  </div>
  <div id="capsule-slot"></div>
  <aside id="timeline-panel" aria-label="Activity timeline"></aside>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-layer"></div>
  <div id="fire-cursor" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
